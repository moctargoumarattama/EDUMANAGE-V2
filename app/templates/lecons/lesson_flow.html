<!DOCTYPE html>
<html lang="{{ session.get('langue', 'fr') }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ lecon.titre }}</title>
    <meta name="theme-color" content="#6C3CE1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Naskh+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/lesson.css') }}" rel="stylesheet">
</head>
<body>
    <header id="progress-bar-container">
        <button id="btn-quitter" onclick="quitterLecon()" aria-label="{{ _('Quitter la leçon') }}">&times;</button>
        <div id="progress-track">
            <div id="progress-fill"></div>
        </div>
        <div id="xp-counter">
            <span aria-hidden="true">&#9889;</span><span id="xp-display">{{ current_xp }}</span>
        </div>
    </header>

    <main class="lesson-shell">
        <section class="lesson-stage lesson-stage-card">
            <div class="lesson-progress-pill">
                <span class="lesson-progress-pill__eyebrow">{{ cours.nom }}</span>
                <span class="lesson-progress-pill__meta">{{ lecon.duree_minutes or 0 }} min • {{ lecon.questions|length }} question{% if lecon.questions|length != 1 %}s{% endif %}</span>
            </div>

            <div class="lesson-stage-head">
                <h1 class="lesson-stage-title">{{ lecon.titre }}</h1>
                <p class="lesson-stage-subtitle">{{ _('Avancez pas à pas avec audio, écriture et correction immédiate.') }}</p>
            </div>

            <div id="exercise-zone" class="lesson-exercise-zone"></div>
        </section>
    </main>

    <div id="feedback-footer" class="hidden">
        <div id="feedback-content">
            <div id="feedback-icon"></div>
            <div id="feedback-text"></div>
        </div>
        <button id="btn-continuer" onclick="questionSuivante()">{{ _('Continuer') }}</button>
    </div>

    <script>
        const QUESTIONS = {{ questions_json|safe }};
        const LECON_ID = {{ lecon.id }};
        const POINTS_RECOMPENSE = {{ lecon.points_recompense or 10 }};
        const CSRF_TOKEN = {{ csrf_token()|tojson }};
        const COURSES_URL = {{ url_for('courses.liste')|tojson }};
        const COURSE_DETAIL_URL = {{ url_for('courses.detail', cours_id=cours.id)|tojson }};
        window.APP_CSRF_TOKEN = CSRF_TOKEN;
        window.LESSON_I18N = {
            chooseAnswer: {{ _('Choisissez la bonne réponse')|tojson }},
            listenChoose: {{ _('Écoutez et choisissez')|tojson }},
            putInOrder: {{ _("Remettez les mots dans l'ordre")|tojson }},
            dictationPrompt: {{ _('Écoutez et écrivez ce que vous entendez')|tojson }},
            listenWord: {{ _('Écouter le mot')|tojson }},
            repeat: {{ _('Répéter')|tojson }},
            writeHere: {{ _('Écrivez ici...')|tojson }},
            validate: {{ _('Valider')|tojson }},
            correct: {{ _('Correct !')|tojson }},
            incorrect: {{ _('Pas tout à fait.')|tojson }},
            lessonDone: {{ _('Leçon terminée !')|tojson }},
            keepGoing: {{ _('Continue comme ça !')|tojson }},
            correctCount: {{ _('Correctes')|tojson }},
            errorCount: {{ _('Erreurs')|tojson }},
            score: {{ _('Score')|tojson }},
            totalXp: {{ _('XP total')|tojson }},
            streak: {{ _('Série')|tojson }},
            nextLesson: {{ _('Leçon suivante')|tojson }},
            backToCourses: {{ _('Retour aux cours')|tojson }},
            viewCourse: {{ _('Voir le cours')|tojson }},
            quitConfirm: {{ _('Quitter la leçon ? Ta progression sera perdue.')|tojson }},
            goodAnswerPrefix: {{ _('Bonne réponse :')|tojson }},
            speakingPrompt: {{ _('Prononcez cette phrase')|tojson }},
            speakingChromeOnly: {{ _("La reconnaissance vocale n'est disponible que sur Chrome. Essayez sur Chrome Android ou Chrome Desktop.")|tojson }},
            skipQuestion: {{ _('Passer cette question')|tojson }},
            listenExample: {{ _("Écouter l'exemple")|tojson }},
            pressToSpeak: {{ _('Appuyez pour parler')|tojson }},
            speakNow: {{ _('Parlez maintenant...')|tojson }},
            pronunciationGood: {{ _('Bonne prononciation !')|tojson }},
            retry: {{ _('Réessayez')|tojson }},
            expectedLabel: {{ _('Attendu :')|tojson }},
            noSpeechDetected: {{ _('Aucune voix détectée. Réessayez.')|tojson }},
            micDenied: {{ _("Accès au microphone refusé. Autorisez le micro dans les paramètres du navigateur.")|tojson }},
            speechUnavailable: {{ _('Reconnaissance vocale indisponible sur ce navigateur.')|tojson }},
            youSaidPrefix: {{ _('Vous avez dit :')|tojson }},
            questionCount: {{ _('Question')|tojson }},
            tapHint: {{ _('Touchez la bonne carte pour continuer.')|tojson }},
            listenHint: {{ _('Écoutez, puis choisissez la bonne réponse.')|tojson }},
            orderHint: {{ _('Glissez ou touchez les mots pour reformer la phrase.')|tojson }},
            dictationHint: {{ _('Écoutez, écrivez, puis validez.')|tojson }}
        };
    </script>
    <script src="{{ url_for('static', filename='js/pwa.js') }}"></script>
    <script src="{{ url_for('static', filename='js/lesson.js') }}"></script>
</body>
</html>
